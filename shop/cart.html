<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cart | Aryam's Jewelry</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0b0a08" />
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Manrope:wght@300;400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/shop.css" />
</head>
<body class="shop-body">
  <header class="shop-top">
    <div class="nav-wrap">
      <a class="brand" href="../index.html">
        <span class="brand-en">ARYAM&rsquo;S <em>JEWELRY</em></span>
        <span class="brand-ar" lang="ar" dir="rtl">مجوهرات أريام</span>
      </a>
      <nav class="shop-nav">
        <a href="index.html">Continue shopping</a>
        <a class="cart-link" href="cart.html">
          Cart <span class="cart-badge" data-cart-count hidden>0</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="cart-page">
    <h1>Your <em>Cart</em></h1>
    <div id="cartLines"></div>
    <div class="cart-summary" id="cartSummary">
      <div class="row"><span>Subtotal</span><span id="cartSubtotal">$0.00</span></div>
      <p class="muted" style="color:var(--muted);font-size:0.88rem;margin:0.5rem 0 1rem">
        Pickup / shipping arranged with the store after checkout. Taxes if applicable calculated at payment.
      </p>
      <a class="btn btn-gold" href="checkout.html">Proceed to checkout</a>
    </div>
  </main>

  <script src="../js/shop/config.js"></script>
  <script src="../js/shop/pricing.js"></script>
  <script src="../js/shop/cart.js"></script>
  <script src="../js/shop/cart-ui.js"></script>
</body>
</html>
