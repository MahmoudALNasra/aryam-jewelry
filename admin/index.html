<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Admin Login | Aryam's Jewelry</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body class="admin-body">
  <div class="login-card">
    <p class="eyebrow">Aryam admin</p>
    <h1>Sign in</h1>
    <p>Demo password gate until Supabase Auth is connected. Default is in <code>env.example</code>.</p>
    <form id="loginForm" class="form-grid" style="margin-top:1.5rem">
      <label>Password
        <input name="password" type="password" required autocomplete="current-password" />
      </label>
      <p id="loginError" class="notice warn" hidden></p>
      <button class="btn btn-gold" type="submit">Enter admin</button>
    </form>
    <p style="margin-top:1.5rem;font-size:0.85rem;color:var(--muted)">
      <a href="/shop/">← Back to shop</a>
    </p>
  </div>
  <script src="/js/shop/config.js"></script>
  <script src="/js/admin/auth.js"></script>
  <script src="/js/admin/admin-ui.js"></script>
</body>
</html>
